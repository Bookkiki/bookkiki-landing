<script>
  // 바로 설치 링크(/app). 두 가지 변형이 있다.
  //  - /app (variant=auto): 아이폰·아이패드는 App Store로, 안드로이드는 Google Play로 곧바로 보낸다.
  //    인스타·페이스북 등 앱 안 브라우저에서도 이동한다(/download는 인앱이면 이동하지 않고 페이지를 보여 줌).
  //    이동이 막히면 이 화면(스토어 카드)이 남는다. 데스크톱은 이동하지 않는다. ?stay=1이면 이동하지 않는다(확인용).
  //  - /app?v=card (variant=card): 이동하지 않고 스토어 카드 화면에 머문다.
  //  스토어 버튼은 App Store·Google Play 두 개를 같은 크기로(로고 + 스토어 이름만, /download 헤더 버튼과 같은 모양).
  //
  // 스토어 집계 값은 /download(landing_* / bookkiki_landing)와 겹치지 않게 따로 둔다.
  //  - App Store: ?pt=129374064&ct=<go|gocard>_<ctx>_<ad|direct>&mt=8  (App Store Connect → 분석 → 획득 → 캠페인)
  //  - Google Play: referrer=utm_source=bookkiki_go&utm_medium=<ctx>&utm_campaign=<go_link|go_card>&utm_content=<ad|direct>
  //  - ctx: ig_inapp · fb_inapp · threads_inapp · kakao_inapp · naver_inapp · line_inapp · web
  //  - ad: 주소에 fbclid·gclid·utm_source가 있을 때(광고 클릭), 아니면 direct
  //  광고 주소에 utm_campaign·utm_content가 있으면 스토어에서 광고·소재별로 설치를 나눠 볼 수 있게 그 값을 넘긴다.
  //  - Google Play: utm_campaign=<광고 utm_campaign>, utm_content=<광고 utm_content> (없는 값은 위 기본값)
  //  - App Store: ct=<go|gocard>_<광고 utm_content> (ct는 40자까지라 소재 이름만 넣는다. OS별 캠페인이 하나씩이라 캠페인은 OS로 구분)
  //  - 영문·숫자·_·-·. 만 남기고 40자로 자른다.
  //
  // GA4(G-4N1YBK6QTL, /download와 같은 웹 속성). 페이지 경로 /app 으로 구분한다. gtag.js는 받지 않고 직접 보낸다.
  //  - page_view: ctx, src, variant
  //  - store_click: store(ios|android), position(go_auto = 자동 이동 | go_button = 버튼), ctx, src, variant(auto|card)
  //  ※ medium·source·campaign 같은 이름은 GA가 캠페인 값으로 읽어 세션 소스/매체를 덮어쓰므로 이벤트 매개변수로 쓰지 않는다.
  //  ※ 광고 앱은 랜딩을 미리 불러올 수 있다. 화면에 실제로 보일 때(visibilityState=visible)만 보내고 이동한다.
  (function () {
    var PLAY = 'https://play.google.com/store/apps/details?id=com.bookkiki.app';
    var APP_STORE = 'https://apps.apple.com/kr/app/id6810455009', APP_STORE_PT = '129374064';
    var GA_ID = 'G-4N1YBK6QTL';
    var ua = navigator.userAgent || '', q = location.search;
    var variant = /[?&]v=card(&|$)/.test(q) ? 'card' : 'auto';
    var src = /[?&](fbclid|gclid|utm_source)=/.test(q) ? 'ad' : 'direct';
    var ctx = /Threads|Barcelona/i.test(ua) ? 'threads_inapp' :
      /Instagram/i.test(ua) ? 'ig_inapp' :
      /FBAN|FBAV|FB_IAB|FBIOS/i.test(ua) ? 'fb_inapp' :
      /KAKAOTALK/i.test(ua) ? 'kakao_inapp' :
      /NAVER\(inapp/i.test(ua) ? 'naver_inapp' :
      /Line\//i.test(ua) ? 'line_inapp' : 'web';
    var isAndroid = /Android/i.test(ua);
    // iPadOS 13 이상은 데스크톱 Safari처럼 Mac으로 표시되므로 터치 지원으로 구분한다.
    var isIOS = !isAndroid && (/iPhone|iPad|iPod/i.test(ua) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1));
    var stay = /[?&]stay=1/.test(q), gaDebug = /[?&]ga_debug=1/.test(q);
    var card = variant === 'card';
    function utm(name) {
      var m = q.match(new RegExp('[?&]' + name + '=([^&#]*)'));
      if (!m) return '';
      try { m = decodeURIComponent(m[1].replace(/\+/g, ' ')); } catch (e) { m = m[1]; }
      return m.replace(/[^A-Za-z0-9_.-]/g, '').slice(0, 40);
    }
    var adCampaign = utm('utm_campaign'), adContent = utm('utm_content');
    var iosUrl = APP_STORE + '?pt=' + APP_STORE_PT + '&ct=' +
      ((card ? 'gocard_' : 'go_') + (adContent || ctx + '_' + src)).slice(0, 40) + '&mt=8';
    var playUrl = PLAY + '&referrer=' + encodeURIComponent('utm_source=bookkiki_go&utm_medium=' + ctx +
      '&utm_campaign=' + (adCampaign || (card ? 'go_card' : 'go_link')) + '&utm_content=' + (adContent || src));

    // 사용자 id(cid)·세션 id(sid): 이 사이트의 _ga 쿠키가 있으면 이어 쓰고, 없으면 페이지당 한 번 만든다(쿠키는 쓰지 않음).
    var ga = (function () {
      var now = Math.floor(Date.now() / 1000), ck = document.cookie || '', m, st = { sid: String(now), sct: 1, newSession: true };
      m = ck.match(/(?:^|;\s*)_ga=GA\d\.\d\.(\d+\.\d+)/);
      var cid = m ? m[1] : Math.floor(Math.random() * 2147483647) + '.' + now;
      m = ck.match(new RegExp('(?:^|;\\s*)_ga_' + GA_ID.slice(2) + '=([^;]+)'));
      if (m) {
        var v = m[1], sid, sct, t;
        if (/^GS2\./.test(v)) { sid = (v.match(/[.$]s(\d+)/) || [])[1]; sct = (v.match(/\$o(\d+)/) || [])[1]; t = (v.match(/\$t(\d+)/) || [])[1]; }
        else { var f = v.split('.'); sid = f[2]; sct = f[3]; t = f[5]; }
        if (sid && t && now - (+t) < 1800) st = { sid: sid, sct: +sct || 1, newSession: false };
        else if (sct) st.sct = (+sct || 0) + 1;
      }
      return { cid: cid, sid: st.sid, sct: st.sct, newUser: !/(?:^|;\s*)_ga=/.test(ck), newSession: st.newSession, seq: 0 };
    })();
    function beacon(name, params) {
      try {
        var first = ga.seq === 0;
        var p = {
          v: '2', tid: GA_ID, cid: ga.cid, sid: ga.sid, sct: String(ga.sct), seg: first ? '0' : '1', _s: String(++ga.seq), npa: '1',
          ul: (navigator.language || '').toLowerCase(), sr: screen.width + 'x' + screen.height,
          dl: location.href, dt: document.title, en: name, 'ep.src': src, 'ep.ctx': ctx, 'ep.variant': variant
        };
        for (var n in params) p['ep.' + n] = params[n];
        if (first && ga.newSession) { p._ss = '1'; p._nsi = '1'; if (ga.newUser) p._fv = '1'; }
        if (document.referrer) p.dr = document.referrer;
        if (gaDebug) p._dbg = '1';
        var qs = [];
        for (var k in p) qs.push(encodeURIComponent(k) + '=' + encodeURIComponent(p[k]));
        var url = 'https://www.google-analytics.com/g/collect?' + qs.join('&');
        if (!(navigator.sendBeacon && navigator.sendBeacon(url))) {
          if (window.fetch) fetch(url, { method: 'POST', mode: 'no-cors', keepalive: true });
          else new Image().src = url;
        }
      } catch (e) {}
    }
    // 페이지 조회는 화면에 처음 보일 때 한 번만 보낸다.
    var pvSent = false;
    function pageView() { if (!pvSent) { pvSent = true; beacon('page_view', {}); } }

    // 화면에 실제로 보일 때 fn을 한 번 실행한다(미리 불러오기·백그라운드 탭·프리렌더 중에는 기다림).
    function whenVisible(fn) {
      var done = false;
      function check() {
        if (done || document.visibilityState !== 'visible' || document.prerendering) return;
        done = true;
        document.removeEventListener('visibilitychange', check);
        document.removeEventListener('prerenderingchange', check);
        fn();
      }
      document.addEventListener('visibilitychange', check);
      document.addEventListener('prerenderingchange', check);
      check();
    }

    var store = isIOS ? 'ios' : isAndroid ? 'android' : '';
    var auto = !!store && !stay && !card, went = false;
    window.BK_GO = {
      ios: iosUrl, play: playUrl, store: store, auto: auto,
      track: function (s) { pageView(); beacon('store_click', { store: s, position: 'go_button' }); }
    };

    whenVisible(function () {
      pageView();
      if (!auto || went) return;
      // 이동은 페이지가 열린 뒤 한 번만(스토어에서 돌아와도 다시 보내지 않음).
      went = true;
      beacon('store_click', { store: store, position: 'go_auto' });
      // 전송이 나갈 시간을 잠깐 준 뒤 이동한다. 그사이 화면이 가려졌으면 다시 보일 때 이동한다.
      setTimeout(function () {
        whenVisible(function () { location.replace(store === 'ios' ? iosUrl : playUrl); });
      }, 250);
    });
  })();
</script>
<style>
  :root{--canvas:#f6f5f4;--surface:#fff;--ink:rgba(0,0,0,.95);--ink2:#31302e;--muted:#615d59;--coral:#D9614F;--app:#FBF6EF}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--canvas);color:var(--ink);font-family:Pretendard,Inter,-apple-system,system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;word-break:keep-all}
  a{color:inherit;text-decoration:none}
  h1,p,figure{margin:0}
  main{max-width:440px;margin:0 auto;padding:28px 16px 36px}
  .card{background:var(--surface);border-radius:24px;padding:26px 20px 22px;text-align:center;box-shadow:rgba(0,0,0,.02) 0 .8px 2.9px,rgba(0,0,0,.04) 0 4px 18px}
  .icon{display:block;width:88px;height:88px;margin:0 auto;border-radius:20px;box-shadow:0 6px 18px -8px rgba(60,40,30,.35)}
  h1{margin-top:14px;font-size:26px;font-weight:800;letter-spacing:-.04em;line-height:1.2}
  .lead{margin-top:6px;font-size:16px;font-weight:600;color:var(--coral);letter-spacing:-.02em}
  .status{margin-top:12px;font-size:14px;color:var(--muted)}
  .status:empty{display:none}
  /* 스토어 버튼(/download 헤더 버튼과 같은 모양): 로고 + 스토어 이름만, 두 개 같은 크기. */
  .badges{margin-top:18px;display:flex;justify-content:center;gap:10px}
  .badge{flex:1 1 0;max-width:180px;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 12px;border-radius:9999px;background:#1d1b19;color:#fff;font-size:16px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;transition:background .15s,transform .08s}
  .badge:hover{background:#000}
  .badge:active{transform:scale(.97)}
  .badge svg{width:20px;height:20px;flex:none}
  @media (max-width:374px){.badge{font-size:15px;gap:6px;padding:0 8px}.badge svg{width:18px;height:18px}}
  .shots{margin-top:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .shots img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;border-radius:14px;background:var(--app)}
  .cap{margin-top:12px;text-align:center;font-size:13px;color:var(--muted)}
  .kid{margin-top:40px;text-align:center}
  .kid h2{margin:0;font-size:clamp(30px,8.4vw,40px);font-weight:800;line-height:1.18;letter-spacing:-.045em}
  .kid h2 em{font-style:normal;color:var(--coral)}
  .kid .sub{margin-top:12px;font-size:16px;color:var(--muted);line-height:1.6}
  .pile{margin-top:22px}
  .pile .ph{border-radius:20px;overflow:hidden;background:var(--app);box-shadow:0 24px 48px -28px rgba(60,35,20,.45)}
  .pile .ph img{display:block;width:100%;height:auto}
  .pile figcaption{margin-top:12px;font-size:14px;color:var(--muted);text-align:center}
  .pile figcaption b{color:var(--ink);font-weight:700}
  .more{display:block;margin-top:16px;text-align:center;font-size:14px;font-weight:600;color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <section class="card" aria-label="북끼끼 앱 받기">
    <img class="icon" src="../assets/app-icon-192.webp" width="88" height="88" alt="북끼끼 앱 아이콘">
    <h1>북끼끼</h1>
    <p class="lead">우리 아이가 주인공인 영어 동화책</p>
    <p class="status" id="status" aria-live="polite"></p>
    <div class="badges" id="badges">
      <a aria-label="App Store에서 북끼끼 받기" class="badge b-ios" id="iosBtn" data-store="ios" href="https://apps.apple.com/kr/app/id6810455009?pt=129374064&amp;ct=go_web_direct&amp;mt=8"><svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M16.4 12.6c0-2.4 2-3.6 2.1-3.7-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.2-.8-1.6 0-3.1 1-4 2.4-1.7 3-.4 7.4 1.2 9.8.8 1.2 1.8 2.5 3 2.4 1.2 0 1.7-.8 3.1-.8 1.5 0 1.9.8 3.2.8 1.3 0 2.1-1.2 2.9-2.4.9-1.4 1.3-2.7 1.3-2.8 0 0-2.4-1-2.4-3.9zM14 5.5c.7-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1.1.1 2.1-.6 2.8-1.4z"/></svg><span>App Store</span></a>
      <a aria-label="Google Play에서 북끼끼 받기" class="badge b-play" id="playBtn" data-store="android" href="https://play.google.com/store/apps/details?id=com.bookkiki.app&amp;referrer=utm_source%3Dbookkiki_go%26utm_medium%3Dweb%26utm_campaign%3Dgo_link%26utm_content%3Ddirect"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#34A853" d="M3.6 2.2 13.4 12l-9.8 9.8c-.4-.2-.6-.6-.6-1.1V3.3c0-.5.2-.9.6-1.1z"/><path fill="#FBBC04" d="m16.8 15.4-3.4-3.4 3.4-3.4 3.9 2.2c1.1.6 1.1 1.8 0 2.4z"/><path fill="#4285F4" d="M16.8 15.4 13.4 12l-9.8 9.8c.4.2.9.2 1.4-.1z"/><path fill="#EA4335" d="M16.8 8.6 5 2.3c-.5-.3-1-.3-1.4-.1L13.4 12z"/></svg><span>Google Play</span></a>
    </div>
  </section>
  <div class="shots">
    <img src="../assets/download/slide-classic-1.webp" width="800" height="1000" decoding="async" alt="옛날 동화·고전 책장 화면: 전체 30권 중 오즈의 마법사(추천 나이 5-9세)">
    <img src="../assets/download/slide-classic-2.webp" width="800" height="1000" decoding="async" alt="오즈의 마법사 등장인물 카드: 도로시, 허수아비, 양철 나무꾼, 겁쟁이 사자, 모두 우리 아이가 될 수 있어요">
    <img src="../assets/download/slide-classic-page-v2.webp" width="800" height="1000" decoding="async" alt="완성된 오즈의 마법사 본문: 회오리바람에 날아오르는 집 창밖으로 토토를 안은 아이, 글상자 A big wind comes., 효과음 Whoosh!, 말풍선 Hold on, Toto!">
  </div>
  <p class="cap">고른 이야기 속 주인공이 우리 아이가 돼요</p>
  <section class="kid" aria-label="우리 아이가 주인공인 영어 동화책">
    <h2><em>우리 아이가<br>주인공</em>인<br>영어 동화책</h2>
    <p class="sub">아이 수준에 맞춘 영어로, <br>아이가 주인공인 동화책을 만들어요</p>
  </section>
  <figure class="pile">
    <div class="ph"><img src="../assets/download/books-shelf-v6-720.webp" srcset="../assets/download/books-shelf-v6-720.webp 720w, ../assets/download/books-shelf-v6.webp 1200w" sizes="(min-width:472px) 408px, calc(100vw - 32px)" width="1200" height="800" loading="lazy" decoding="async" alt="창가 테이블 위에 놓인 북끼끼 옛날 동화 하드커버 책들(오즈의 마법사, 흥부와 놀부, 해님 달님, 비밀의 화원)과 펼쳐진 실제 동화책 두 권: 참기름 바른 나무에서 미끄러진 호랑이가 나오는 해님 달님(Tiger used oil. Slip! He fell.)과 꽃길에서 늑대를 만나는 빨간 모자(Look, pretty flowers!)"></div>
    <figcaption><b>옛날 동화 30권</b></figcaption>
  </figure>
  <a class="more" id="more" href="../download/" hidden>북끼끼 자세히 보기</a>
</main>
<script>
  (function () {
    var G = window.BK_GO;
    if (!G) return;
    var ios = document.getElementById('iosBtn'), play = document.getElementById('playBtn');
    ios.href = G.ios; play.href = G.play;
    function onTap(e) { G.track(e.currentTarget.getAttribute('data-store')); }
    ios.addEventListener('click', onTap, true);
    play.addEventListener('click', onTap, true);

    if (G.auto) {
      var status = document.getElementById('status');
      status.textContent = (G.store === 'ios' ? 'App Store' : 'Google Play') + '로 이동하고 있어요';
      // 이동이 막혀 화면에 남아 있으면 버튼 안내로 바꾼다.
      setTimeout(function () { status.textContent = '자동으로 열리지 않으면 아래 버튼을 눌러 주세요'; }, 2500);
    } else if (!G.store) {
      // 데스크톱: 자세한 안내는 /download로.
      document.getElementById('status').textContent = '휴대폰에서 북끼끼 앱을 받아 보세요';
      document.getElementById('more').hidden = false;
    }
  })();
</script>
