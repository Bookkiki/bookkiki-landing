name: Policy documents

on:
  pull_request:
    paths:
      - ".github/workflows/policy-documents.yml"
      - "ko-KR/**"
      - "policies/**"
      - "scripts/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/policy-documents.yml"
      - "ko-KR/**"
      - "policies/**"
      - "scripts/**"
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable policy snapshots
        run: ./scripts/check-policy-documents.sh
      - name: Prevent historical policy changes
        if: github.event_name == 'pull_request'
        run: python3 scripts/check-policy-history.py "${{ github.event.pull_request.base.sha }}"

  public-links:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public policy URLs
        run: ./scripts/check-policy-documents.sh https://www.bookkiki.com
