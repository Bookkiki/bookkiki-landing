name: Policy documents

on:
  pull_request:
    paths:
      - ".github/workflows/policy-documents.yml"
      - "ko-KR/**"
      - "policies/**"
      - "scripts/check-policy-documents.sh"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/policy-documents.yml"
      - "ko-KR/**"
      - "policies/**"
      - "scripts/check-policy-documents.sh"
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable policy snapshots
        run: ./scripts/check-policy-documents.sh

  public-links:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public policy URLs
        run: ./scripts/check-policy-documents.sh https://www.bookkiki.com
