<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>북끼끼 앱 다운로드</title>
<meta name="description" content="우리 아이가 주인공인 영어 동화책, 북끼끼 앱을 받아 보세요. 안드로이드는 Google Play, 아이폰은 App Store에서 받을 수 있습니다.">
<meta property="og:title" content="북끼끼 - 우리 아이가 주인공인 영어 동화책">
<meta property="og:description" content="App Store · Google Play에서 북끼끼 앱을 받아 보세요.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://bookkiki.com/download/">
<meta property="og:site_name" content="북끼끼">
<meta property="og:image" content="https://bookkiki.com/assets/og-download-v2.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="북끼끼 앱 - App Store, Google Play에서 받기">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
<script>
  // 기기에 맞는 스토어로 바로 보낸다. ?stay=1이면 이동하지 않고 안내 화면을 보여 준다.
  (function () {
    var PLAY = 'https://play.google.com/store/apps/details?id=com.bookkiki.app';
    var APP_STORE = 'https://apps.apple.com/kr/app/id6810455009';
    if (/[?&]stay=1/.test(location.search)) return;
    var ua = navigator.userAgent || '';
    var isAndroid = /Android/i.test(ua);
    // iPadOS 13 이상은 데스크톱 Safari처럼 Mac으로 표시되므로 터치 지원으로 구분한다.
    var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (isAndroid) location.replace(PLAY);
    else if (isIOS) location.replace(APP_STORE);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .dl{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 20px;background:radial-gradient(ellipse at 30% 40%,#FFF9EF 0%,#FBEBD3 70%,#F6DFC0 100%);overflow:hidden}
  .dl-inner{width:100%;max-width:1040px;display:flex;align-items:center;gap:32px}
  .dl-kiki{width:240px;flex:0 0 auto}
  .dl-text{flex:1 1 auto;min-width:0}
  .dl-name{font-family:"Noto Sans KR",sans-serif;font-size:64px;font-weight:900;color:#2A1A12;letter-spacing:-2px;line-height:1;margin:0}
  .dl-name span{font-family:'Playfair Display',serif;font-size:34px;color:#8A6A55;margin-left:10px;letter-spacing:0}
  .dl-tag{margin:22px 0 0;font-size:40px;line-height:1.25;font-weight:900;color:#2A1A12;letter-spacing:-1.2px}
  .dl-tag em{font-style:normal;color:#D9614F}
  .dl-sub{margin:14px 0 0;color:#5B4536;font-size:1.05rem;line-height:1.6}
  .dl-stores{margin-top:28px;display:flex;flex-wrap:wrap;gap:12px}
  .dl-store{display:flex;align-items:center;gap:10px;padding:11px 20px;border-radius:14px;background:#111;color:#fff;min-width:190px}
  .dl-store:hover{background:#2A1A12}
  .dl-store svg{width:28px;height:28px;flex:0 0 auto}
  .dl-store small{display:block;font-size:12px;font-weight:500;opacity:.85;line-height:1.1}
  .dl-store b{display:block;font-size:21px;font-weight:700;line-height:1.2}
  .dl-home{display:inline-block;margin-top:22px;color:#5B4536;font-size:.9rem;text-decoration:underline;text-underline-offset:3px}
  .dl-covers{position:relative;flex:0 0 300px;height:420px}
  .dl-cover{position:absolute;width:190px;height:190px;border-radius:10px;border:5px solid #fff;box-shadow:0 14px 28px rgba(80,45,20,.28);object-fit:cover}
  .dl-cover.c1{left:0;top:0;transform:rotate(-6deg)}
  .dl-cover.c2{left:100px;top:120px;transform:rotate(5deg)}
  .dl-cover.c3{left:10px;top:225px;transform:rotate(-3deg)}
  @media (max-width:860px){
    .dl-inner{flex-direction:column;text-align:center;gap:18px}
    .dl-kiki{width:160px}
    .dl-name{font-size:48px}.dl-name span{font-size:26px}
    .dl-tag{font-size:30px}
    .dl-stores{justify-content:center}
    .dl-store{min-width:0;flex:1 1 200px;max-width:260px;justify-content:center}
    .dl-covers{flex:0 0 auto;width:300px;height:300px}
    .dl-cover{width:140px;height:140px}
    .dl-cover.c1{left:10px;top:10px}.dl-cover.c2{left:150px;top:60px}.dl-cover.c3{left:60px;top:150px}
  }
</style>
</head>
<body>
<main class="dl">
  <div class="dl-inner">
    <img class="dl-kiki" src="../assets/kiki-reading.png" alt="책을 읽는 북끼끼 캐릭터 키키">
    <div class="dl-text">
      <h1 class="dl-name">북끼끼<span>Bookkiki</span></h1>
      <p class="dl-tag"><em>우리 아이가 주인공</em>인<br>영어 동화책 앱</p>
      <p class="dl-sub">아이가 들려준 이야기도, 옛날 동화도<br>아이 이름이 들어간 영어 그림책으로 만들어요.</p>
      <div class="dl-stores">
        <a class="dl-store" href="https://apps.apple.com/kr/app/id6810455009"><svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M16.4 12.6c0-2.4 2-3.6 2.1-3.7-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.2-.8-1.6 0-3.1 1-4 2.4-1.7 3-.4 7.4 1.2 9.8.8 1.2 1.8 2.5 3 2.4 1.2 0 1.7-.8 3.1-.8 1.5 0 1.9.8 3.2.8 1.3 0 2.1-1.2 2.9-2.4.9-1.4 1.3-2.7 1.3-2.8 0 0-2.4-1-2.4-3.9zM14 5.5c.7-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1.1.1 2.1-.6 2.8-1.4z"/></svg><span><small>Download on the</small><b>App Store</b></span></a>
        <a class="dl-store" href="https://play.google.com/store/apps/details?id=com.bookkiki.app"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#34A853" d="M3.6 2.2 13.4 12l-9.8 9.8c-.4-.2-.6-.6-.6-1.1V3.3c0-.5.2-.9.6-1.1z"/><path fill="#FBBC04" d="m16.8 15.4-3.4-3.4 3.4-3.4 3.9 2.2c1.1.6 1.1 1.8 0 2.4z"/><path fill="#4285F4" d="M16.8 15.4 13.4 12l-9.8 9.8c.4.2.9.2 1.4-.1z"/><path fill="#EA4335" d="M16.8 8.6 5 2.3c-.5-.3-1-.3-1.4-.1L13.4 12z"/></svg><span><small>GET IT ON</small><b>Google Play</b></span></a>
      </div>
      <a class="dl-home" href="../">북끼끼 홈페이지 보기</a>
    </div>
    <div class="dl-covers" aria-hidden="true">
      <img class="dl-cover c1" src="../assets/download-cover-oz.jpg" alt="">
      <img class="dl-cover c2" src="../assets/download-cover-cinderella.jpg" alt="">
      <img class="dl-cover c3" src="../assets/download-cover-sunmoon.jpg" alt="">
    </div>
  </div>
</main>
</body>
</html>
